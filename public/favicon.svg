<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="26" fill="#0A0A0F"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7B2FBE"/>
    </linearGradient>
  </defs>
  <!-- radial glow behind circle -->
  <circle cx="64" cy="64" r="62" fill="url(#glow)"/>
  <!-- main circle -->
  <circle cx="64" cy="64" r="52" fill="url(#circleGrad)"/>
  <!-- white N -->
  <text x="64" y="89" font-family="Arial Black, sans-serif" font-weight="900" font-size="72" text-anchor="middle" fill="#ffffff">N</text>
</svg>
